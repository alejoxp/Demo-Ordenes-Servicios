{% extends "base.html" %}

{% block title %}Editar Orden #{{ orden.id_orden_servicio }}{% endblock %}

{% block content %}
<div class="card" style="max-width: 900px; margin: 0 auto;">
    <div class="page-header">
        <div>
            <h1 class="page-title">✏️ Editar Orden de Servicio #{{ orden.id_orden_servicio }}</h1>
            <p style="color: #718096; margin-top: 0.5rem;">Modifica la información de la orden</p>
        </div>
    </div>
    
    <form method="POST">
        <div class="form-grid-3-cols">
            <!-- Columna 1 -->
            <div class="form-group">
                <label for="id_cliente">Cliente *</label>
                <select id="id_cliente" name="id_cliente" class="form-control" required>
                    {% for cliente in clientes %}
                    <option value="{{ cliente.id_cliente }}" {% if cliente.id_cliente == orden.id_cliente %}selected{% endif %}>
                        {{ cliente.nombre }} {{ cliente.apellido }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label for="id_equipo">Equipo *</label>
                <select id="id_equipo" name="id_equipo" class="form-control" required>
                    <option value="">-- Primero selecciona un cliente --</option>
                </select>
            </div>

            <div class="form-group">
                <label for="id_servicio">Servicio Requerido *</label>
                <select id="id_servicio" name="id_servicio" class="form-control" required>
                    {% for servicio in servicios %}
                    <option value="{{ servicio.id_servicio }}" {% if servicio.id_servicio == orden.id_servicio %}selected{% endif %}>
                        {{ servicio.nombre_servicio }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Columna 2 -->
            <div class="form-group">
                <label for="id_tecnico">Técnico Asignado *</label>
                <select id="id_tecnico" name="id_tecnico" class="form-control" required>
                    {% for tecnico in tecnicos %}
                    <option value="{{ tecnico.id_tecnico }}" {% if tecnico.id_tecnico == orden.id_tecnico %}selected{% endif %}>
                        {{ tecnico.nombre }} {{ tecnico.apellido }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="id_tipo_orden">Tipo de Orden</label>
                <select id="id_tipo_orden" name="id_tipo_orden" class="form-control">
                    {% for tipo in tipos_orden %}
                    <option value="{{ tipo.id_tipo_orden }}" {% if tipo.id_tipo_orden == orden.id_tipo_orden %}selected{% endif %}>
                        {{ tipo.nombre_tipo }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="id_prioridad">Prioridad</label>
                <select id="id_prioridad" name="id_prioridad" class="form-control">
                    {% for prioridad in prioridades %}
                    <option value="{{ prioridad.id_prioridad }}" {% if prioridad.id_prioridad == orden.id_prioridad %}selected{% endif %}>
                        {{ prioridad.nombre_prioridad }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            
            <!-- Columna 3 -->
            <div class="form-group">
                <label for="id_estatus">Estatus</label>
                <select id="id_estatus" name="id_estatus" class="form-control">
                    {% for estatus in estatus_orden %}
                    <option value="{{ estatus.id_estatus }}" {% if estatus.id_estatus == orden.id_estatus %}selected{% endif %}>
                        {{ estatus.nombre_estatus }}
                    </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-group full-width" style="margin-top: 1.5rem;">
            <label for="descripcion_problema">Descripción del Problema *</label>
            <textarea id="descripcion_problema" name="descripcion_problema" class="form-control" required>{{ orden.descripcion_problema or '' }}</textarea>
        </div>
        
        <div class="form-group full-width" style="margin-top: 1rem;">
            <label for="diagnostico_tecnico">Diagnóstico del Técnico</label>
            <textarea id="diagnostico_tecnico" name="diagnostico_tecnico" class="form-control">{{ orden.diagnostico_tecnico or '' }}</textarea>
        </div>

        <div class="form-group full-width" style="margin-top: 1rem;">
            <label for="solucion_problema">Solución del Problema</label>
            <textarea id="solucion_problema" name="solucion_problema" class="form-control">{{ orden.solucion_problema or '' }}</textarea>
        </div>
        
        <div style="display: flex; gap: 1rem; margin-top: 2rem; justify-content: flex-end;">
            <a href="{{ url_for('orden_servicio.listar_ordenes') }}" class="btn btn-secondary">
                Cancelar
            </a>
            <button type="submit" class="btn btn-primary">
                💾 Guardar Cambios
            </button>
        </div>
    </form>
</div>

{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const clienteSelect = document.getElementById('id_cliente');
    const equipoSelect = document.getElementById('id_equipo');
    const initialClienteId = '{{ orden.id_cliente }}';
    const initialEquipoId = '{{ orden.id_equipo }}';

    function cargarEquipos(clienteId, equipoSeleccionadoId) {
        equipoSelect.innerHTML = '<option value="">Cargando equipos...</option>';
        equipoSelect.disabled = true;

        if (!clienteId) {
            equipoSelect.innerHTML = '<option value="">-- Primero selecciona un cliente --</option>';
            return;
        }

        fetch(`/equipos/cliente/${clienteId}`)
            .then(response => response.json())
            .then(data => {
                if (data.exito && data.data.length > 0) {
                    equipoSelect.innerHTML = '<option value="">-- Seleccionar Equipo --</option>';
                    data.data.forEach(equipo => {
                        const optionText = `${equipo.marca || ''} ${equipo.modelo || ''} (Serial: ${equipo.numero_serie || 'N/A'})`.trim();
                        const option = new Option(optionText, equipo.id_equipo);
                        if (equipo.id_equipo == equipoSeleccionadoId) {
                            option.selected = true;
                        }
                        equipoSelect.appendChild(option);
                    });
                    equipoSelect.disabled = false;
                } else {
                    equipoSelect.innerHTML = '<option value="">-- No hay equipos para este cliente --</option>';
                }
            })
            .catch(error => {
                console.error('Error al cargar equipos:', error);
                equipoSelect.innerHTML = '<option value="">-- Error al cargar equipos --</option>';
            });
    }

    if (initialClienteId) {
        cargarEquipos(initialClienteId, initialEquipoId);
    }

    clienteSelect.addEventListener('change', function() {
        cargarEquipos(this.value, null);
    });
});
</script>
{% endblock %}
